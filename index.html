<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ағылшын Оңай</title>
<meta name="description" content="Ағылшын тілін қазақ тілінде үйренуге арналған сайт: сөздік, фразалар, карточкалар, тест және айтылым.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f8fc; --surface:#ffffff; --surface-2:#e8f3fa; --text:#0f2537; --muted:#4a6275; --border:#d0e1ed;
  --accent:#0074b3; --accent-strong:#005a8c; --accent-soft:#dcf0fb; --on-accent:#ffffff;
  --gold:#f2b705; --gold-ink:#7a5600; --gold-soft:#fff3c9;
  --ok:#1b8049; --ok-soft:#e0f4e8; --bad:#c22d38; --bad-soft:#fde5e7;
  --shadow:0 1px 2px rgba(15,37,55,.06),0 6px 18px rgba(15,37,55,.06);
  --radius:14px; --radius-sm:10px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0b1722; --surface:#12212f; --surface-2:#173041; --text:#e8f1f8; --muted:#9fb5c5; --border:#263c4e;
    --accent:#4cc3f5; --accent-strong:#86d6f9; --accent-soft:#133649; --on-accent:#04202e;
    --gold:#f7c531; --gold-ink:#ffd866; --gold-soft:#3a2f0b;
    --ok:#4ade80; --ok-soft:#0f3320; --bad:#f87171; --bad-soft:#3d1518;
    --shadow:none; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0b1722; --surface:#12212f; --surface-2:#173041; --text:#e8f1f8; --muted:#9fb5c5; --border:#263c4e;
  --accent:#4cc3f5; --accent-strong:#86d6f9; --accent-soft:#133649; --on-accent:#04202e;
  --gold:#f7c531; --gold-ink:#ffd866; --gold-soft:#3a2f0b;
  --ok:#4ade80; --ok-soft:#0f3320; --bad:#f87171; --bad-soft:#3d1518;
  --shadow:none; color-scheme:dark;
}
html{font-size:17px}
html.kid{font-size:19px; --radius:22px; --radius-sm:16px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Nunito,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
h1,h2,h3{line-height:1.25;margin:0 0 .5em}
h1{font-size:1.75rem;font-weight:900}
h2{font-size:1.3rem;font-weight:800}
h3{font-size:1.1rem;font-weight:800}
p{margin:0 0 .8em}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px;border-radius:6px}
.wrap{max-width:1080px;margin:0 auto;padding:0 16px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.muted{color:var(--muted)}

/* Header */
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border)}
.toprow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:10px;padding-bottom:6px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--text);font-weight:800;font-size:1.15rem;white-space:nowrap}
.logo{width:38px;height:38px;border-radius:12px;background:var(--accent);color:var(--on-accent);display:grid;place-items:center;font-weight:900;position:relative}
.logo::after{content:"";position:absolute;right:-3px;top:-3px;width:13px;height:13px;border-radius:50%;background:var(--gold);border:2px solid var(--surface)}
.brand b{color:var(--accent)}
.tools{display:flex;gap:6px;align-items:center}
.tool{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:700;font-size:.85rem;display:flex;align-items:center;gap:6px;min-height:38px}
.tool:hover{background:var(--surface-2)}
.tool[aria-pressed="true"]{background:var(--gold-soft);border-color:var(--gold);color:var(--gold-ink)}
.nav{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;padding-bottom:8px}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:0 0 auto;text-decoration:none;color:var(--muted);font-weight:700;padding:7px 12px;border-radius:999px;font-size:.92rem;white-space:nowrap}
.nav a:hover{background:var(--surface-2);color:var(--text)}
.nav a.active{background:var(--accent);color:var(--on-accent)}
@media (max-width:620px){.tool .tl{display:none}.brand .bt{font-size:1rem}}

main{padding-top:24px;padding-bottom:48px;min-height:70vh}
footer{border-top:1px solid var(--border);padding:20px 0;color:var(--muted);font-size:.85rem;text-align:center}

/* Common */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px;box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);border-radius:var(--radius-sm);padding:10px 18px;font-weight:800;cursor:pointer;text-decoration:none;min-height:44px;line-height:1.2}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.primary:hover{background:var(--accent-strong);border-color:var(--accent-strong)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#3b2a00}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
:root[data-theme="dark"] .btn.ok, :root[data-theme="dark"] .btn.danger{color:#07130c}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn.ok,:root:not([data-theme="light"]) .btn.danger{color:#07130c}}
.btn.ghost{background:transparent;border-color:transparent}
.btn.big{padding:14px 26px;font-size:1.05rem}
.btn:disabled{opacity:.5;cursor:not-allowed}
.say{border:1px solid var(--border);background:var(--accent-soft);color:var(--accent);border-radius:999px;width:38px;height:38px;display:inline-grid;place-items:center;cursor:pointer;flex:0 0 auto;padding:0}
.say:hover{background:var(--accent);color:var(--on-accent)}
.say svg{width:18px;height:18px}
.page-head{margin-bottom:20px}
.lead{color:var(--muted);font-size:1.05rem;max-width:62ch}
.eyebrow{font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800;margin-bottom:10px}
.bar{height:10px;background:var(--surface-2);border-radius:999px;overflow:hidden}
.bar>span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:999px;transition:width .3s}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:700;font-size:.9rem;min-height:38px}
.chip:hover{background:var(--surface-2)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--border);border-radius:var(--radius-sm);overflow:hidden;background:var(--surface)}
.seg label{position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0;inset:0;cursor:pointer}
.seg span{display:block;padding:8px 14px;font-weight:700;font-size:.92rem}
.seg input:checked+span{background:var(--accent);color:var(--on-accent)}
.seg input:focus-visible+span{outline:3px solid var(--gold);outline-offset:-3px}
select,input[type=search]{border:1px solid var(--border);background:var(--surface);border-radius:var(--radius-sm);padding:9px 12px;min-height:44px;max-width:100%}
input[type=search]{width:100%}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.field>label,.lbl{font-weight:800;font-size:.9rem}
.check{display:flex;align-items:center;gap:10px;font-weight:700;margin-bottom:12px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--accent)}
.lvl{font-size:.75rem;font-weight:800;padding:2px 10px;border-radius:999px;white-space:nowrap}
.lvl1{background:var(--ok-soft);color:var(--ok)}
.lvl2{background:var(--gold-soft);color:var(--gold-ink)}
.stars{color:var(--gold);letter-spacing:2px}
.stars .off{color:var(--border)}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}

/* Home */
.hero{background:linear-gradient(135deg,var(--accent) 0%,#2aa3dd 100%);color:#fff;border-radius:var(--radius);padding:32px 24px;margin-bottom:20px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:var(--gold);opacity:.9}
.hero>*{position:relative;z-index:1;max-width:620px}
@media (max-width:620px){.hero::after{width:130px;height:130px;right:-55px;top:-55px}}
.hero p{font-size:1.08rem;opacity:.95}
.hero .btn{border-color:rgba(255,255,255,.6);background:rgba(255,255,255,.12);color:#fff}
.hero .btn.gold{background:var(--gold);border-color:var(--gold);color:#3b2a00}
.hero-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:28px}
@media (max-width:760px){.home-grid{grid-template-columns:1fr}}
.wotd-main{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.wotd-emoji{font-size:3rem;line-height:1}
.wotd-en{font-size:2rem;font-weight:900;color:var(--accent)}
.wotd-tr{color:var(--muted);font-weight:700}
.wotd-kk{font-size:1.25rem;font-weight:800;margin:6px 0 14px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stat{background:var(--surface-2);border-radius:var(--radius-sm);padding:12px 14px}
.stat b{display:block;font-size:1.6rem;font-weight:900;line-height:1.2}
.stat span{font-size:.85rem;color:var(--muted);font-weight:700}
.stats.four{grid-template-columns:repeat(4,1fr)}
@media (max-width:700px){.stats.four{grid-template-columns:1fr 1fr}}
.path{list-style:none;padding:0;margin:0;display:grid;grid-template-columns:repeat(4,1fr);gap:14px;counter-reset:s}
@media (max-width:860px){.path{grid-template-columns:1fr 1fr}}
@media (max-width:460px){.path{grid-template-columns:1fr}}
.path a{display:block;height:100%;text-decoration:none;color:var(--text);background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.path a:hover{border-color:var(--accent)}
.path .num{display:inline-grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--gold);color:#3b2a00;font-weight:900;margin-bottom:8px}
.path b{display:block;font-size:1.05rem}
.path span{color:var(--muted);font-size:.92rem}

/* Words */
.filters{display:grid;gap:14px;margin-bottom:18px}
.frow{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.count{color:var(--muted);font-weight:700;margin-bottom:10px}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.wcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;display:flex;gap:12px;box-shadow:var(--shadow)}
.wcard.is-learned{border-color:var(--ok);background:linear-gradient(0deg,var(--ok-soft),var(--surface) 60%)}
.wemoji{font-size:2.2rem;line-height:1;padding-top:4px}
.wbody{flex:1;min-width:0}
.wtop{display:flex;align-items:center;justify-content:space-between;gap:8px}
.wen{font-size:1.2rem;font-weight:900;color:var(--accent);overflow-wrap:anywhere}
.wtr{color:var(--muted);font-weight:600;font-size:.92rem}
.wkk{font-weight:800;margin:2px 0 10px}
.wfoot{display:flex;justify-content:space-between;align-items:center;gap:8px}
.learn{border:1px solid var(--border);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:.82rem;font-weight:800;cursor:pointer;min-height:34px}
.learn:hover{border-color:var(--ok);color:var(--ok)}
.learn[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}

/* Phrases */
.dlg-head{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin:20px 0 14px}
.lines{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:12px}
.line{display:flex;gap:10px;align-items:flex-start}
.line.s1{flex-direction:row-reverse}
.spk{flex:0 0 auto;font-size:.78rem;font-weight:800;background:var(--surface-2);color:var(--muted);border-radius:999px;padding:4px 10px;margin-top:10px;max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bubble{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;max-width:min(560px,100%);flex:1 1 auto;box-shadow:var(--shadow);transition:border-color .2s,background .2s}
.line.s1 .bubble{background:var(--accent-soft);border-color:transparent}
.line.playing .bubble{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.len{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;font-weight:800;font-size:1.08rem}
.ltr{color:var(--muted);font-size:.9rem;font-weight:600}
.lkk{margin-top:4px;font-weight:700}
.lkk.blur{filter:blur(6px);cursor:pointer;user-select:none}
.lkk.blur:hover{filter:blur(4px)}

/* Flashcards */
.setup{max-width:560px}
.sess-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:800}
.flip{perspective:1200px;margin:20px auto;max-width:520px;cursor:pointer;border-radius:var(--radius)}
.flip-inner{position:relative;min-height:260px;transition:transform .5s;transform-style:preserve-3d}
.flip.flipped .flip-inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:var(--radius);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;border:1px solid var(--border);box-shadow:var(--shadow)}
.front{background:var(--surface)}
.back{background:var(--accent-soft);transform:rotateY(180deg)}
.fc-emoji{font-size:3.4rem;line-height:1.1}
.fc-main{font-size:2.1rem;font-weight:900;overflow-wrap:anywhere}
.front .fc-main{color:var(--accent)}
.fc-tr{color:var(--muted);font-weight:700}
.hint{position:absolute;bottom:12px;font-size:.8rem;color:var(--muted);font-weight:700}
.card-actions{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin-top:12px}
.card-actions.two .btn{flex:1 1 180px;max-width:250px}
.result{text-align:center;max-width:520px;margin:0 auto}
.result .big-stars{font-size:3rem;color:var(--gold);letter-spacing:6px}
.result .big-stars .off{color:var(--border)}
.result .score{font-size:1.4rem;font-weight:900}

/* Quiz */
.types{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px;margin-bottom:18px}
.type{border:2px solid var(--border);background:var(--surface);border-radius:var(--radius);padding:14px;text-align:left;cursor:pointer}
.type:hover{border-color:var(--accent)}
.type[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.type b{display:block;font-size:1rem}
.type span{font-size:.86rem;color:var(--muted)}
.type .ti{font-size:1.6rem;display:block;margin-bottom:4px}
.qcard{max-width:640px;margin:16px auto 0}
.qtype{font-size:.8rem;font-weight:800;color:var(--accent);background:var(--accent-soft);padding:3px 10px;border-radius:999px}
.qprompt{text-align:center;margin:10px 0 20px}
.qprompt .q-ask{color:var(--muted);font-weight:700;font-size:.95rem}
.qprompt .q-word{font-size:2rem;font-weight:900;color:var(--accent);overflow-wrap:anywhere}
.qprompt .q-emoji{font-size:2.6rem;line-height:1.1}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.opts{grid-template-columns:1fr}}
.opt{border:2px solid var(--border);background:var(--surface);border-radius:var(--radius-sm);padding:14px;font-weight:800;font-size:1.02rem;cursor:pointer;text-align:center;min-height:56px}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--surface-2)}
.opt:disabled{cursor:default}
.opt.correct{border-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft);color:var(--bad)}
.listen-big{width:96px;height:96px;border-radius:50%;border:none;background:var(--accent);color:var(--on-accent);cursor:pointer;display:inline-grid;place-items:center}
.listen-big svg{width:42px;height:42px}
.build-target{min-height:64px;border:2px dashed var(--border);border-radius:var(--radius-sm);padding:10px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.build-target.correct{border-color:var(--ok);border-style:solid;background:var(--ok-soft)}
.build-target.wrong{border-color:var(--bad);border-style:solid;background:var(--bad-soft)}
.build-pool{display:flex;flex-wrap:wrap;gap:8px;min-height:48px;margin-bottom:14px}
.tile{border:1px solid var(--border);background:var(--surface-2);border-radius:10px;padding:8px 14px;font-weight:800;cursor:pointer;min-height:42px}
.tile:hover:not(:disabled){border-color:var(--accent)}
.build-target .tile{background:var(--accent-soft);border-color:var(--accent)}
.feedback{min-height:1.6em;margin-top:14px;font-weight:800;text-align:center}
.feedback.good{color:var(--ok)}
.feedback.bad{color:var(--bad)}
.qnav{display:flex;justify-content:center;margin-top:12px}

/* Sounds */
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.sbox{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;text-align:center}
.sbox .kz{font-size:2.2rem;font-weight:900;color:var(--accent);line-height:1.2}
.sbox .ipa{font-weight:800;color:var(--muted)}
.sbox .ex{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:6px;font-weight:700}
.hard{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.hard h3{display:flex;gap:10px;align-items:baseline}
.hard h3 .ipa{color:var(--muted);font-size:.95rem}
.exs{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.exw{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--surface-2);border-radius:999px;padding:4px 6px 4px 12px;font-weight:800;cursor:pointer}
.exw:hover{border-color:var(--accent)}
.exw i{font-style:normal;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:grid;place-items:center}
.exw i svg{width:14px;height:14px}
.pairs{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.pair{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px}
.pw{border:none;background:var(--surface-2);border-radius:var(--radius-sm);padding:10px 8px;cursor:pointer;text-align:center}
.pw:hover{background:var(--accent-soft)}
.pw b{display:block;font-size:1.15rem;color:var(--accent)}
.pw small{display:block;color:var(--muted);font-weight:700}
.pw .m{font-size:.85rem;font-weight:700;color:var(--text)}
.vs{font-weight:900;color:var(--gold-ink)}
.section{margin-top:32px}
.note{background:var(--gold-soft);border-left:4px solid var(--gold);border-radius:var(--radius-sm);padding:12px 16px;margin-bottom:16px}

/* Progress */
.tbars{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px 24px}
.tbar-h{display:flex;justify-content:space-between;font-weight:700;font-size:.92rem;margin-bottom:4px}
.tbar-h span:last-child{color:var(--muted)}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.92rem}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--border)}
th{color:var(--muted);font-size:.8rem;text-transform:uppercase;letter-spacing:.05em}
.confirm{background:var(--bad-soft);border:1px solid var(--bad);border-radius:var(--radius-sm);padding:14px;margin-top:12px}
.confirm p{font-weight:800;color:var(--bad)}

/* Modal */
.modal{position:fixed;inset:0;background:rgba(5,20,32,.6);display:grid;place-items:center;padding:16px;z-index:50}
.modal[hidden]{display:none}
.dialog{background:var(--surface);border-radius:20px;padding:28px 22px;max-width:560px;width:100%;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.3);max-height:calc(100vh - 32px);overflow:auto}
.mode-choices{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}
@media (max-width:440px){.mode-choices{grid-template-columns:1fr}}

/* ===================== КҮЙ (localStorage) ===================== */
const KEY = 'agylshyn-onai-v1';
const DEFAULTS = {mode:null, learned:{}, stars:0, tests:[], days:[], slow:false, theme:null};
function load(){ let d = {}; try { d = JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e) {} return Object.assign({}, DEFAULTS, d); }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }

const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today = () => ymd(new Date());
function markActive(){ const t = today(); if (!S.days.includes(t)) { S.days.push(t); S.days = S.days.slice(-400); } save(); }
function streak(){
  const d = new Date(); let n = 0;
  if (!S.days.includes(ymd(d))) d.setDate(d.getDate()-1);
  while (S.days.includes(ymd(d))) { n++; d.setDate(d.getDate()-1); }
  return n;
}

const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];

const shuffle = a => { a = [...a]; for (let i=a.length-1;i>0;i--) { const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; };
const pick = a => a[Math.floor(Math.random()*a.length)];

/* ===================== ДЫБЫСТАУ ===================== */
const hasTTS = 'speechSynthesis' in window;
let voices = [];
function loadVoices(){
  if (!hasTTS) return;
  const all = speechSynthesis.getVoices();
  voices = all.filter(v => /^en[-_](US|GB)/i.test(v.lang));
  if (!voices.length) voices = all.filter(v => /^en/i.test(v.lang));
  // Сапалырақ дауыстарды алға шығару
  voices.sort((a,b) => (/google|natural|online|samantha|daniel/i.test(b.name)?1:0) - (/google|natural|online|samantha|daniel/i.test(a.name)?1:0));
}
if (hasTTS) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function utter(text, pitch=1, vi=0){
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'en-US';
  if (voices.length) { const v = voices[vi % voices.length]; u.voice = v; u.lang = v.lang; }
  u.rate = S.slow ? 0.62 : 0.92;
  u.pitch = pitch;
  return u;
}
function speak(text){
  if (!hasTTS) { toast('Бұл браузер дыбыстауды қолдамайды'); return; }
  speechSynthesis.cancel();
  speechSynthesis.speak(utter(text));
}
function speakSeq(items, onLine, onDone){
  if (!hasTTS) { toast('Бұл браузер дыбыстауды қолдамайды'); return; }
  speechSynthesis.cancel();
  items.forEach((it, i) => {
    const u = utter(it.text, it.pitch, it.vi);
    u.onstart = () => onLine && onLine(i);
    if (i === items.length-1) { u.onend = () => onDone && onDone(); u.onerror = u.onend; }
    speechSynthesis.speak(u);
  });
}
function stopSpeech(){ if (hasTTS) speechSynthesis.cancel(); }

/* ===================== ЖАЛПЫ ОҚИҒАЛАР ===================== */
document.addEventListener('click', e => {
  const s = e.target.closest('[data-say]');
  if (s) { e.stopPropagation(); speak(s.dataset.say); return; }
  const l = e.target.closest('[data-learn]');
  if (l) { toggleLearn(l.dataset.learn); }
});
function toggleLearn(id){
  if (S.learned[id]) delete S.learned[id]; else { S.learned[id] = true; toast(isKid() ? 'Жарайсың! ⭐' : 'Үйренілді деп белгіленді'); }
  markActive();
  const on = !!S.learned[id];
  $$(`[data-learn="${id}"]`).forEach(b => {
    b.setAttribute('aria-pressed', on);
    b.textContent = on ? '✓ Үйренілді' : 'Үйрендім';
    const card = b.closest('.wcard'); if (card) card.classList.toggle('is-learned', on);
  });
}

const C = {topic:'all', lvl:0, dir:'en', unl:false, deck:null, i:0, known:0, flipped:false, result:null};
function cardPool(){
  return (C.topic === 'all' ? availWords() : topicById(C.topic).words)
    .filter(w => !C.lvl || w.lvl === C.lvl)
    .filter(w => !C.unl || !S.learned[w.id]);
}
function pageCards(){
  if (C.topic !== 'all' && !availTopics().some(t => t.id === C.topic)) C.topic = 'all';
  if (C.result) return cardResult();
  if (C.deck) return cardSession();
  app.innerHTML = `
  <div class="page-head"><h1>Карточкалар</h1>
  <p class="lead">Карточканы басып аударыңыз. Сөзді білсеңіз — «Білемін», әлі есте жоқ болса — «Тағы қайталаймын». Бір колодада 20 сөзге дейін.</p></div>
  <form class="card setup" id="cset">
    <div class="field"><label for="ct">Тақырып</label><select id="ct">${topicOptions(C.topic)}</select></div>
    <div class="field"><span class="lbl">Деңгей</span>${seg('clvl', [[0,'Барлығы'],[1,'Қарапайым'],[2,'Күрделі']], C.lvl, 'Деңгей')}</div>
    <div class="field"><span class="lbl">Бағыты</span>${seg('cdir', [['en','EN → KZ'],['kk','KZ → EN']], C.dir, 'Бағыты')}</div>
    <label class="check"><input type="checkbox" id="cunl" ${C.unl?'checked':''}> Тек үйренілмеген сөздер</label>
    <p class="muted" id="ccount" aria-live="polite"></p>
    <button class="btn primary big" type="submit" id="cstart">Бастау</button>
  </form>`;
  const upd = () => {
    const n = cardPool().length;
    $('#ccount').textContent = n ? `Таңдалған сөздер: ${n} (колодада ${Math.min(n,20)})` : 'Бұл баптауда сөз жоқ. Басқа тақырып таңдаңыз.';
    $('#cstart').disabled = !n;
  };
  $('#ct').addEventListener('change', e => { C.topic = e.target.value; upd(); });
  $$('input[name=clvl]').forEach(r => r.addEventListener('change', () => { C.lvl = +r.value; upd(); }));
  $$('input[name=cdir]').forEach(r => r.addEventListener('change', () => { C.dir = r.value; }));
  $('#cunl').addEventListener('change', e => { C.unl = e.target.checked; upd(); });
  $('#cset').addEventListener('submit', e => {
    e.preventDefault();
    const pool = cardPool(); if (!pool.length) return;
    C.deck = shuffle(pool).slice(0, 20); C.i = 0; C.known = 0; C.flipped = false;
    cardSession();
  });
  upd();
}
function cardSession(){
  const w = C.deck[C.i], k = isKid();
  const enSide = `<div class="fc-main" lang="en">${esc(w.en)}</div><div class="fc-tr">[${esc(w.tr)}]</div>`;
  const kkSide = `<div class="fc-main">${esc(w.kk)}</div>`;
  const emoji = k ? `<div class="fc-emoji" aria-hidden="true">${w.em}</div>` : '';
  const front = C.dir === 'en' ? emoji + enSide : emoji + kkSide;
  const back = C.dir === 'en' ? kkSide + `<div class="fc-tr" style="margin-top:6px">${esc(w.en)}</div>` : enSide;
  app.innerHTML = `
  <div class="sess-head"><button class="btn ghost" id="cquit">← Шығу</button><span>${C.i+1} / ${C.deck.length}</span></div>
  <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${C.deck.length}" aria-valuenow="${C.i}"><span style="width:${C.i/C.deck.length*100}%"></span></div>
  <div class="flip ${C.flipped?'flipped':''}" id="flip" role="button" tabindex="0" aria-label="Карточканы аудару">
    <div class="flip-inner">
      <div class="face front" aria-hidden="${C.flipped}">${front}<div class="hint">Аудару үшін басыңыз</div></div>
      <div class="face back" aria-hidden="${!C.flipped}">${back}<div class="hint">Қайта аудару үшін басыңыз</div></div>
    </div>
  </div>
  <div class="card-actions"><button class="btn" data-say="${esc(w.en)}">${SPK.replace('<svg','<svg width="20" height="20"')} Тыңдау</button></div>
  <div class="card-actions two">
    <button class="btn" id="again">↻ Тағы қайталаймын</button>
    <button class="btn ok" id="know">✓ Білемін</button>
  </div>`;
  const flip = $('#flip');
  const doFlip = () => {
    C.flipped = !C.flipped; flip.classList.toggle('flipped', C.flipped);
    $('.front', flip).setAttribute('aria-hidden', C.flipped); $('.back', flip).setAttribute('aria-hidden', !C.flipped);
  };
  flip.addEventListener('click', doFlip);
  flip.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); doFlip(); } });
  $('#cquit').addEventListener('click', () => { C.deck = null; pageCards(); });
  $('#again').addEventListener('click', () => nextCard(false));
  $('#know').addEventListener('click', () => nextCard(true));
  flip.focus({preventScroll:true});
}
function nextCard(knew){
  const w = C.deck[C.i];
  if (knew) { C.known++; S.learned[w.id] = true; }
  markActive();
  C.i++; C.flipped = false;
  if (C.i >= C.deck.length) {
    const stars = starsFor(C.known / C.deck.length);
    S.stars += stars; save();
    C.result = {known:C.known, total:C.deck.length, stars};
    C.deck = null;
    return cardResult();
  }
  cardSession();
}
function cardResult(){
  const r = C.result, k = isKid();
  app.innerHTML = `
  <div class="card result">
    <h1>${r.stars >= 2 ? praise() : (k ? 'Жақсы талпыныс!' : 'Колода аяқталды')}</h1>
    <div class="big-stars" aria-label="${r.stars} жұлдыз">${'★'.repeat(r.stars)}<span class="off">${'★'.repeat(3-r.stars)}</span></div>
    <p class="score">${r.known} / ${r.total} сөзді білесіз</p>
    <p class="muted">${r.known === r.total ? 'Барлық сөз үйренілді деп белгіленді!' : 'Қиын сөздерді тағы бір рет қайталап көріңіз.'}</p>
    <div class="card-actions">
      <button class="btn primary" id="cagain">↻ Жаңа колода</button>
      <button class="btn" id="csetup">Басқа баптау</button>
      <a class="btn" href="#quiz">Тест тапсыру →</a>
    </div>
  </div>`;
  $('#cagain').addEventListener('click', () => {
    C.result = null; const pool = cardPool();
    if (!pool.length) return pageCards();
    C.deck = shuffle(pool).slice(0,20); C.i = 0; C.known = 0; C.flipped = false; cardSession();
  });
  $('#csetup').addEventListener('click', () => { C.result = null; pageCards(); });
}

/* ===================== ТЕСТ ===================== */
const QTYPES = {
  mix:   {icon:'🎲', name:'Аралас', desc:'Барлық тапсырма түрі аралас'},
  tr:    {icon:'🇰🇿', name:'Аудармасын тап', desc:'Ағылшын сөзінің қазақша аудармасын таңдаңыз'},
  en:    {icon:'🇬🇧', name:'Ағылшынша тап', desc:'Қазақ сөзінің ағылшынша баламасын таңдаңыз'},
  listen:{icon:'🎧', name:'Тыңда да тап', desc:'Сөзді тыңдап, жазылуын таңдаңыз'},
  build: {icon:'🧩', name:'Сөйлем құрастыр', desc:'Сөздерден сөйлем құраңыз (диалогтар бойынша)'}
};
const Q = {type:'mix', topic:'all', qs:null, i:0, score:0, answered:false, built:[], result:null};
function buildLines(){
  return availDialogs().flatMap(d => d.lines).filter(l => { const n = l.en.split(/\s+/).length; return n >= 3 && n <= 7; });
}
function tokensOf(en){ return en.replace(/[.,!?]/g, '').split(/\s+/).filter(Boolean); }
function makeQuestions(){
  const base = Q.topic === 'all' ? availWords() : topicById(Q.topic).words;
  const all = availWords();
  const lines = shuffle(buildLines());
  let wordPool = shuffle(base);
  const qs = [];
  for (let n = 0; n < 10; n++) {
    const t = Q.type === 'mix' ? pick(['tr','en','listen','build']) : Q.type;
    if (t === 'build') {
      const l = lines[n % lines.length];
      const tokens = tokensOf(l.en);
      let order = shuffle(tokens.map((_,i) => i));
      for (let g = 0; g < 5 && order.every((v,i) => v === i); g++) order = shuffle(order);
      qs.push({t, line:l, tokens, order});
      continue;
    }
    if (!wordPool.length) wordPool = shuffle(base);
    const w = wordPool.pop();
    const field = t === 'tr' ? 'kk' : 'en';
    const seen = new Set([w[field].toLowerCase(), w.en.toLowerCase(), w.kk.toLowerCase()]);
    const distractors = [];
    for (const src of [shuffle(base), shuffle(all)]) {
      for (const x of src) {
        if (distractors.length >= 3) break;
        const key = x[field].toLowerCase();
        if (seen.has(key) || seen.has(x.en.toLowerCase()) || seen.has(x.kk.toLowerCase())) continue;
        seen.add(key); distractors.push(x);
      }
    }
    const opts = shuffle([{label:w[field], correct:true}, ...distractors.map(x => ({label:x[field], correct:false}))]);
    qs.push({t, w, opts});
  }
  return qs;
}
function pageQuiz(){
  if (Q.topic !== 'all' && !availTopics().some(t => t.id === Q.topic)) Q.topic = 'all';
  if (Q.result) return quizResult();
  if (Q.qs) return quizQuestion();
  app.innerHTML = `
  <div class="page-head"><h1>Тест</h1>
  <p class="lead">10 сұрақ. Тапсырма түрін және тақырыпты таңдаңыз. 90% және одан жоғары — ★★★, 70% — ★★, 40% — ★.</p></div>
  <h2 class="eyebrow">Тапсырма түрі</h2>
  <div class="types" role="group" aria-label="Тапсырма түрі">
    ${Object.entries(QTYPES).map(([id,t]) => `<button class="type" data-qtype="${id}" aria-pressed="${Q.type===id}"><span class="ti" aria-hidden="true">${t.icon}</span><b>${t.name}</b><span>${t.desc}</span></button>`).join('')}
  </div>
  <div class="card setup">
    <div class="field"><label for="qt">Тақырып</label><select id="qt">${topicOptions(Q.topic)}</select>
    <small class="muted" id="qtnote"></small></div>
    <button class="btn primary big" id="qstart">Тестті бастау</button>
  </div>`;
  const note = () => { $('#qtnote').textContent = Q.type === 'build' ? '«Сөйлем құрастыр» тапсырмасы диалогтардан алынады.' : ''; };
  $$('[data-qtype]').forEach(b => b.addEventListener('click', () => {
    Q.type = b.dataset.qtype; $$('[data-qtype]').forEach(x => x.setAttribute('aria-pressed', x === b)); note();
  }));
  $('#qt').addEventListener('change', e => { Q.topic = e.target.value; });
  $('#qstart').addEventListener('click', () => {
    Q.qs = makeQuestions(); Q.i = 0; Q.score = 0; Q.answered = false; Q.built = [];
    quizQuestion();
  });
  note();
}
function quizQuestion(){
  const q = Q.qs[Q.i], k = isKid();
  let body = '';
  if (q.t === 'tr') {
    body = `<div class="qprompt">${k ? `<div class="q-emoji" aria-hidden="true">${q.w.em}</div>` : ''}
      <div class="q-ask">Бұл сөздің аудармасы қандай?</div>
      <div style="display:flex;justify-content:center;align-items:center;gap:10px"><span class="q-word" lang="en">${esc(q.w.en)}</span>${sayBtn(q.w.en)}</div>
      <div class="muted">[${esc(q.w.tr)}]</div></div>`;
  } else if (q.t === 'en') {
    body = `<div class="qprompt">${k ? `<div class="q-emoji" aria-hidden="true">${q.w.em}</div>` : ''}
      <div class="q-ask">Ағылшынша қалай болады?</div>
      <div class="q-word">${esc(q.w.kk)}</div></div>`;
  } else if (q.t === 'listen') {
    body = `<div class="qprompt"><div class="q-ask" style="margin-bottom:12px">Тыңдап, естіген сөзді таңдаңыз</div>
      <button class="listen-big" data-say="${esc(q.w.en)}" aria-label="Сөзді тыңдау">${SPK}</button></div>`;
  } else {
    body = `<div class="qprompt"><div class="q-ask">Сөйлемді құрастырыңыз:</div>
      <div class="q-word" style="font-size:1.35rem;color:var(--text)">${esc(q.line.kk)}</div></div>
      <div class="build-target" id="bt" aria-label="Сіздің сөйлеміңіз"></div>
      <div class="build-pool" id="bp" aria-label="Сөздер"></div>
      <div class="qnav"><button class="btn primary" id="check" disabled>Тексеру</button></div>`;
  }
  const opts = q.opts ? `<div class="opts">${q.opts.map((o,i) => `<button class="opt" data-opt="${i}" ${q.t!=='tr'?'lang="en"':''}>${esc(o.label)}</button>`).join('')}</div>` : '';
  app.innerHTML = `
  <div class="sess-head"><button class="btn ghost" id="qquit">← Шығу</button><span>Сұрақ ${Q.i+1} / ${Q.qs.length}</span></div>
  <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${Q.qs.length}" aria-valuenow="${Q.i}"><span style="width:${Q.i/Q.qs.length*100}%"></span></div>
  <div class="card qcard">
    <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap"><span class="qtype">${QTYPES[q.t].icon} ${QTYPES[q.t].name}</span><span class="muted" style="font-weight:800">Ұпай: ${Q.score}</span></div>
    ${body}${opts}
    <div class="feedback" id="fb" aria-live="polite"></div>
    <div class="qnav"><button class="btn primary" id="next" hidden>${Q.i+1 < Q.qs.length ? 'Келесі →' : 'Нәтижені көру'}</button></div>
  </div>`;
  Q.answered = false;
  $('#qquit').addEventListener('click', () => { Q.qs = null; pageQuiz(); });
  $('#next').addEventListener('click', () => {
    Q.i++;
    if (Q.i >= Q.qs.length) return finishQuiz();
    quizQuestion();
  });
  if (q.opts) $$('[data-opt]').forEach(b => b.addEventListener('click', () => answerOpt(q, +b.dataset.opt)));
  if (q.t === 'listen') setTimeout(() => { if (Q.qs && Q.qs[Q.i] === q && !Q.answered) speak(q.w.en); }, 350);
  if (q.t === 'build') { Q.built = []; renderBuild(q); $('#check').addEventListener('click', () => checkBuild(q)); }
}
function answerOpt(q, idx){
  if (Q.answered) return; Q.answered = true;
  const ok = q.opts[idx].correct;
  $$('[data-opt]').forEach((b,i) => { b.disabled = true; if (q.opts[i].correct) b.classList.add('correct'); else if (i === idx) b.classList.add('wrong'); });
  const correct = q.opts.find(o => o.correct).label;
  feedback(ok, correct);
  if (q.t !== 'tr' || ok) speak(q.w.en);
}
function feedback(ok, correct){
  const fb = $('#fb');
  if (ok) { Q.score++; fb.className = 'feedback good'; fb.textContent = '✓ ' + praise(); }
  else { fb.className = 'feedback bad'; fb.textContent = '✗ Қате. Дұрыс жауап: ' + correct; }
  const nx = $('#next'); nx.hidden = false; nx.focus();
}
function renderBuild(q){
  const tile = (ti, where) => `<button class="tile" data-ti="${ti}" data-where="${where}" lang="en" ${Q.answered?'disabled':''}>${esc(q.tokens[ti])}</button>`;
  $('#bt').innerHTML = Q.built.length ? Q.built.map(ti => tile(ti,'t')).join('') : '<span class="muted" style="font-size:.9rem">Төмендегі сөздерді ретімен басыңыз</span>';
  $('#bp').innerHTML = q.order.filter(ti => !Q.built.includes(ti)).map(ti => tile(ti,'p')).join('');
  $$('.tile').forEach(b => b.addEventListener('click', () => {
    const ti = +b.dataset.ti;
    if (b.dataset.where === 'p') Q.built.push(ti); else Q.built = Q.built.filter(x => x !== ti);
    renderBuild(q);
  }));
  const chk = $('#check'); if (chk) chk.disabled = Q.answered || Q.built.length !== q.tokens.length;
}
function checkBuild(q){
  if (Q.answered) return; Q.answered = true;
  const target = q.tokens.join(' ');
  const got = Q.built.map(i => q.tokens[i]).join(' ');
  const ok = got.toLowerCase() === target.toLowerCase();
  renderBuild(q);
  $('#bt').classList.add(ok ? 'correct' : 'wrong');
  $('#check').hidden = true;
  feedback(ok, q.line.en);
  speak(q.line.en);
}
function finishQuiz(){
  const total = Q.qs.length, stars = starsFor(Q.score / total);
  S.stars += stars;
  S.tests.push({d: today(), type: Q.type, topic: Q.topic === 'all' ? 'Барлығы' : topicById(Q.topic).name, score: Q.score, total, stars});
  S.tests = S.tests.slice(-100);
  markActive();
  Q.result = {score:Q.score, total, stars}; Q.qs = null;
  quizResult();
}
function quizResult(){
  const r = Q.result, k = isKid(), pct = Math.round(r.score / r.total * 100);
  app.innerHTML = `
  <div class="card result">
    <h1>${r.stars === 3 ? praise() + (k ? ' 🎉' : '') : r.stars >= 1 ? (k ? 'Жақсы! Тағы талпын!' : 'Жақсы нәтиже!') : (k ? 'Ештеңе етпейді, тағы байқап көр!' : 'Тағы жаттығып көріңіз')}</h1>
    <div class="big-stars" aria-label="${r.stars} жұлдыз">${'★'.repeat(r.stars)}<span class="off">${'★'.repeat(3-r.stars)}</span></div>
    <p class="score">${r.score} / ${r.total} · ${pct}%</p>
    <p class="muted">${r.stars ? `+${r.stars} жұлдыз жиналды!` : 'Жұлдыз алу үшін кемінде 40% дұрыс жауап беру керек.'}</p>
    <div class="card-actions">
      <button class="btn primary" id="qagain">↻ Қайта тапсыру</button>
      <button class="btn" id="qsetup">Басқа тест</button>
      <a class="btn" href="#progress">Жетістіктер →</a>
    </div>
  </div>`;
  $('#qagain').addEventListener('click', () => { Q.result = null; Q.qs = makeQuestions(); Q.i = 0; Q.score = 0; quizQuestion(); });
  $('#qsetup').addEventListener('click', () => { Q.result = null; pageQuiz(); });
}

    ['west','уэст','/west/','батыс','vest','вэст','/vest/','жилет'],
    ['full','фұл','/fʊl/','толы','fool','фу:л','/fuːl/','ақымақ'],
    ['walk','уо:к','/wɔːk/','жаяу жүру','work','уө:к','/wɜːk/','жұмыс']
  ];
  const pw = (en,tr,ipa,kk) => `<button class="pw" data-say="${esc(en)}" aria-label="Тыңдау: ${esc(en)}"><b lang="en">${esc(en)}</b><small>[${esc(tr)}] ${esc(ipa)}</small><span class="m">${esc(kk)}</span></button>`;
  app.innerHTML = `
  <div class="page-head"><h1>Айтылым</h1>
  <p class="lead">Ағылшын дыбыстарын дұрыс айтуды үйреніңіз. Кез келген сөзді басып тыңдаңыз. Жоғарыдағы «🐢 Баяу дауыс» батырмасы дыбыстауды баяулатады.</p></div>
  <div class="note"><b>Транскрипция туралы.</b> Сайттағы транскрипция қазақ әріптерімен жазылған. «:» белгісі — дыбысты созып айту керек дегенді білдіреді: see [си:], food [фу:д]. th дыбыстары «с» және «з» әріптерімен берілген — оларды дұрыс айту жолын төменнен қараңыз.</div>
  <section class="section" aria-labelledby="h1s">
    <h2 id="h1s">Қазақ тілінде бар дыбыстар</h2>
    <p class="muted">Бұл дыбыстар сізге таныс — ағылшын тілінде де дәл солай айтылады.</p>
    <div class="sgrid">${known.map(([kz,ipa,en,tr]) => `<div class="sbox"><div class="kz">${kz}</div><div class="ipa">${ipa}</div><div class="ex"><span lang="en">${en}</span> <span class="muted">[${tr}]</span> ${sayBtn(en)}</div></div>`).join('')}</div>
  </section>
  <section class="section" aria-labelledby="h2s">
    <h2 id="h2s">Қиын дыбыстар</h2>
    <div class="hard">${hard.map(([l,ipa,tip,ex]) => `<div class="card"><h3><span>${l}</span><span class="ipa">${ipa}</span></h3><p>${tip}</p><div class="exs">${ex.map(exw).join('')}</div></div>`).join('')}</div>
  </section>
  <section class="section" aria-labelledby="h3s">
    <h2 id="h3s">Минималды жұптар</h2>
    <p class="muted">Бір ғана дыбысымен ерекшеленетін сөздер. Екеуін кезекпен тыңдап, айырмашылығын естуге тырысыңыз.</p>
    <div class="pairs">${pairs.map(p => `<div class="pair">${pw(p[0],p[1],p[2],p[3])}<span class="vs">≠</span>${pw(p[4],p[5],p[6],p[7])}</div>`).join('')}</div>
  </section>`;
}

/* ===================== ЖЕТІСТІКТЕР ===================== */
function pageProgress(){
  const topics = availTopics();
  const recent = S.tests.slice(-10).reverse();
  app.innerHTML = `
  <div class="page-head"><h1>Жетістіктер</h1><p class="lead">${isKid() ? 'Сенің жетістіктерің! Жұлдыз жинай бер ⭐' : 'Сіздің оқу нәтижелеріңіз. Прогресс осы браузерде сақталады.'}</p></div>
  <div class="stats four" style="margin-bottom:24px">${statTiles()}</div>
  <section class="card" aria-labelledby="tbH" style="margin-bottom:24px">
    <h2 id="tbH">Тақырыптар бойынша</h2>
    <div class="tbars">${topics.map(t => { const n = learnedCount(t.words), all = t.words.length; return `
      <div><div class="tbar-h"><span>${t.icon} ${esc(t.name)}</span><span>${n} / ${all}</span></div>
      <div class="bar" role="progressbar" aria-label="${esc(t.name)}" aria-valuemin="0" aria-valuemax="${all}" aria-valuenow="${n}"><span style="width:${n/all*100}%"></span></div></div>`; }).join('')}</div>
  </section>
  <section class="card" aria-labelledby="ttH" style="margin-bottom:24px">
    <h2 id="ttH">Соңғы тесттер</h2>
    ${recent.length ? `<div class="tablewrap"><table>
      <thead><tr><th>Күні</th><th>Түрі</th><th>Тақырып</th><th>Нәтиже</th><th>Жұлдыз</th></tr></thead>
      <tbody>${recent.map(t => `<tr><td>${t.d.split('-').reverse().join('.')}</td><td>${esc((QTYPES[t.type]||{}).name || t.type)}</td><td>${esc(t.topic)}</td><td><b>${t.score}/${t.total}</b></td><td>${starsHTML(t.stars)}</td></tr>`).join('')}</tbody>
    </table></div>` : `<p class="muted">Әлі тест тапсырылған жоқ. <a href="#quiz">Бірінші тестті тапсыру →</a></p>`}
  </section>
  <section class="card" aria-labelledby="rsH">
    <h2 id="rsH">Прогресті өшіру</h2>
    <p class="muted">Үйренген сөздер, жұлдыздар және тест тарихы толығымен өшіріледі.</p>
    <button class="btn" id="resetBtn">Прогресті өшіру</button>
    <div class="confirm" id="confirm" hidden>
      <p>Барлық прогресс өшіріледі. Бұл әрекетті қайтару мүмкін емес. Сенімдісіз бе?</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn danger" id="resetYes">Иә, өшіру</button><button class="btn" id="resetNo">Жоқ, болдырмау</button></div>
    </div>
  </section>`;
  $('#resetBtn').addEventListener('click', () => { $('#confirm').hidden = false; $('#resetBtn').hidden = true; $('#resetNo').focus(); });
  $('#resetNo').addEventListener('click', () => { $('#confirm').hidden = true; $('#resetBtn').hidden = false; $('#resetBtn').focus(); });
  $('#resetYes').addEventListener('click', () => {
    S = Object.assign({}, DEFAULTS, {mode:S.mode, slow:S.slow, theme:S.theme, learned:{}, tests:[], days:[]});
    save(); toast('Прогресс өшірілді'); pageProgress();
  });
}

/* ===================== ІСКЕ ҚОСУ ===================== */
applyChrome();
route();
if (!S.mode) openModeModal();
</script>
</body>
</html>
